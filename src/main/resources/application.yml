server:
  port: 8080

spring:
  application:
    name: firstclub-membership

  datasource:
    url: jdbc:h2:mem:membershipdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # Schema is now owned by Flyway (src/main/resources/db/migration) instead of
      # Hibernate's auto-DDL - see V1__init_schema.sql for why `none` rather than `validate`.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true

logging:
  level:
    com.firstclub.membership: INFO

membership:
  qualification:
    zone-id: Asia/Kolkata
  reconciliation:
    fixed-delay-ms: 3600000
    initial-delay-ms: 60000
    # Active users re-evaluated per page per sweep, so the job's memory footprint stays
    # bounded regardless of how large the active membership base grows.
    batch-size: 200
  admin:
    # Closed by default. Supply MEMBERSHIP_ADMIN_API_KEY in the deployment environment to enable.
    api-key: ${MEMBERSHIP_ADMIN_API_KEY:}
